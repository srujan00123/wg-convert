services:
  wg-convert:
    build: .
    restart: unless-stopped
    environment:
      # Coolify magic variable — set the domain in the Coolify UI and this
      # gets auto-populated. For plain `docker compose`, set SERVICE_FQDN_WG_CONVERT
      # in a .env file next to this compose file.
      - SERVICE_FQDN_WG_CONVERT=${SERVICE_FQDN_WG_CONVERT:-https://wg.example.com}
      - STREAMLIT_BROWSER_SERVER_ADDRESS=${STREAMLIT_BROWSER_SERVER_ADDRESS:-}
    expose:
      - "8501"
