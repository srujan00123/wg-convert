[project]
name = "wg-convert"
version = "0.1.0"
description = "Convert WireGuard configs (INI or JSON) into canonical <name>.conf files"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
dependencies = [
    "streamlit>=1.56.0",
]

[project.scripts]
wg-convert = "wg_convert:main"

[build-system]
requires = ["uv_build>=0.9.25,<0.10.0"]
build-backend = "uv_build"
